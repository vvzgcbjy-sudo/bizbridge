<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}BIZBRIDGE{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="logo" href="/">◈ BIZ<span>BRIDGE</span></a><form action="/" class="search"><input name="q" placeholder="పోస్టులు వెతుకు"><button>⌕</button></form><nav><a href="/">హోమ్</a><a href="/blogs">బ్లాగ్స్</a>{% if me %}<a href="/upload">＋ పోస్ట్</a><a href="/messages">చాట్</a><a href="/u/{{ me.username }}">ప్రొఫైల్</a><a href="/logout">లాగౌట్</a>{% else %}<a href="/login">లాగిన్</a><a href="/register">Join</a>{% endif %}</nav></header><main>{% with ms=get_flashed_messages(with_categories=true) %}{% for kind,msg in ms %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>BIZBRIDGE · నీ కథ. నీ కమ్యూనిటీ. నీ ప్రపంచం.</footer></body></html>
