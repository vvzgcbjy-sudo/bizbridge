{% extends "base.html" %}{% block content %}<section class="formbox wide"><a href="/">← హోమ్</a><h2>@{{ p.username }}</h2>{% if p.kind=='video' %}<video class="detailmedia" src="/media/{{ p.filename }}" controls></video>{% else %}<img class="detailmedia" src="/media/{{ p.filename }}" alt="post">{% endif %}<p>{{ p.caption }}</p><form method="post" action="/post/{{ p.id }}/like"><button class="{{ 'liked' if p.liked else '' }}">♥ {{ p.likes }} likes</button></form><h3>కామెంట్లు</h3>{% for c in comments %}<p><b>@{{ c.username }}</b> {{ c.body }}</p>{% else %}<p>ఇంకా కామెంట్లు లేవు.</p>{% endfor %}<form method="post" action="/post/{{ p.id }}/comment"><input name="body" required maxlength="1000" placeholder="కామెంట్ రాయండి"><button class="btn">పంపు</button></form></section>{% endblock %}
