{% extends "base.html" %}{% block content %}<section class="formbox"><small>BIZBRIDGE COMMUNITY</small><h1>{{ 'కొత్త అకౌంట్' if mode=='register' else 'లాగిన్ అవ్వు' }}</h1><form method="post">{% if mode=='register' %}<label>Username<input name="username" required minlength="3" maxlength="30"></label><label>Email<input name="email" type="email" required></label><label>Password (8+ characters)<input name="password" type="password" required minlength="8"></label><button class="btn">అకౌంట్ సృష్టించు</button><p>అకౌంట్ ఉందా? <a href="/login">లాగిన్</a></p>{% else %}<label>Username లేదా Email<input name="identity" required></label><label>Password<input name="password" type="password" required></label><button class="btn">లాగిన్</button><p>కొత్తవారా? <a href="/register">రిజిస్టర్ అవ్వండి</a></p>{% endif %}</form></section>{% endblock %}
